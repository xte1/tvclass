name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Build Swift Package App
      run: |
        xcodebuild archive \
          -scheme Tvclass \
          -destination 'generic/platform=iOS' \
          -archivePath build/Tvclass.xcarchive \
          CODE_SIGNING_ALLOWED=NO

        mkdir -p build/Payload
        cp -r build/Tvclass.xcarchive/Products/Applications/*.app build/Payload/ || true
        cp -r build/Tvclass.xcarchive/Products/usr/local/bin/*.app build/Payload/ || true
        cd build
        zip -r Tvclass.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tvclass-Unsigned-IPA
        path: build/Tvclass.ipa
