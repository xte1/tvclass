name: Build iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Compile and Build Package IPA
      run: |
        mkdir -p build/Payload/Tvclass.app

        # تجميع ملفات سويفت المستهدفة لأجهزة آيفون مباشرة
        xcrun -sdk iphoneos swiftc -parse-as-library \
          -target arm64-apple-ios16.0 \
          -o build/Payload/Tvclass.app/Tvclass \
          Tvclass/App.swift \
          Tvclass/Models.swift \
          Tvclass/GlassView.swift \
          Tvclass/APIService.swift \
          Tvclass/DeveloperInfoView.swift \
          Tvclass/PlayerView.swift \
          Tvclass/MovieDetailView.swift \
          Tvclass/ContentView.swift

        # توليد Info.plist
        cat <<EOF > build/Payload/Tvclass.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>Tvclass</string>
            <key>CFBundleIdentifier</key>
            <string>com.tvclass.app</string>
            <key>CFBundleName</key>
            <string>Tvclass</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UILaunchScreen</key>
            <dict/>
        </dict>
        </plist>
        EOF

        # توقيع عابر وتنسيق IPA
        codesign --force --sign - --entitlements /dev/null build/Payload/Tvclass.app
        cd build
        zip -r Tvclass.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tvclass-Unsigned-IPA
        path: build/Tvclass.ipa
